<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PhotoClipper</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>PhotoClipper</h1>
    <p class="tagline">Crop a local photo to 16:9 and other common formats. Everything stays in your browser.</p>
  </header>

  <main class="layout">
    <section class="workspace">
      <div id="dropzone" class="dropzone">
        <p><strong>Drop a photo here</strong> or</p>
        <label class="button primary">
          Choose file
          <input id="file-input" type="file" accept="image/*" hidden>
        </label>
      </div>

      <div id="stage" class="stage" hidden>
        <img id="photo" alt="Loaded photo" draggable="false">
        <div id="crop" class="crop" tabindex="0" aria-label="Crop area. Drag to move, arrow keys to nudge.">
          <div class="grid"></div>
          <span class="handle" data-handle="nw"></span>
          <span class="handle" data-handle="n"></span>
          <span class="handle" data-handle="ne"></span>
          <span class="handle" data-handle="e"></span>
          <span class="handle" data-handle="se"></span>
          <span class="handle" data-handle="s"></span>
          <span class="handle" data-handle="sw"></span>
          <span class="handle" data-handle="w"></span>
        </div>
      </div>
    </section>

    <aside class="sidebar">
      <section class="panel">
        <h2>Format</h2>
        <div id="ratios" class="ratios" role="radiogroup" aria-label="Aspect ratio">
          <button type="button" data-ratio="16:9" class="active">16:9</button>
          <button type="button" data-ratio="4:3">4:3</button>
          <button type="button" data-ratio="3:2">3:2</button>
          <button type="button" data-ratio="1:1">1:1</button>
          <button type="button" data-ratio="5:4">5:4</button>
          <button type="button" data-ratio="21:9">21:9</button>
          <button type="button" data-ratio="original">Original</button>
          <button type="button" data-ratio="free">Free</button>
        </div>
        <div class="row">
          <button type="button" id="orientation" class="button">Portrait ⇄</button>
          <button type="button" id="reset" class="button">Reset area</button>
        </div>
        <p class="hint">Drag the area to move it, drag the handles to resize. Arrow keys nudge (Shift = 10 px).</p>
      </section>

      <section class="panel">
        <h2>Preview</h2>
        <div class="preview-box">
          <canvas id="preview"></canvas>
          <p id="preview-empty" class="muted">Load a photo to see the preview.</p>
        </div>
        <p id="dimensions" class="muted"></p>
      </section>

      <section class="panel">
        <h2>Export</h2>
        <label class="field">
          <span>File type</span>
          <select id="format">
            <option value="image/jpeg">JPEG</option>
            <option value="image/png">PNG</option>
            <option value="image/webp">WebP</option>
          </select>
        </label>
        <label class="field" id="quality-field">
          <span>Quality <output id="quality-value">92</output></span>
          <input id="quality" type="range" min="50" max="100" value="92">
        </label>
        <label class="field">
          <span>Output width (px, empty = full resolution)</span>
          <input id="out-width" type="number" min="16" step="1" placeholder="full">
        </label>
        <button type="button" id="download" class="button primary wide" disabled>Download</button>
        <button type="button" id="change-photo" class="button wide" hidden>Load another photo</button>
      </section>
    </aside>
  </main>

  <script src="app.js"></script>
</body>
</html>
