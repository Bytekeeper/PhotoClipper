<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PhotoClipper</title>
  <meta name="description" content="Crop photos to 16:9 and other common aspect ratios in your browser. Select the area, preview it and download the result. Nothing is uploaded.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>PhotoClipper</h1>
      <p class="tagline" data-i18n="tagline">Crop a local photo to 16:9 and other common formats. Everything stays in your browser.</p>
    </div>
    <a class="repo-link" href="https://github.com/Bytekeeper/PhotoClipper" target="_blank" rel="noopener">
      <svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
      <span data-i18n="sourceLink">Source on GitHub</span>
    </a>
  </header>

  <main class="layout">
    <section class="workspace">
      <div id="dropzone" class="dropzone">
        <p data-i18n-html="dropHere"><strong>Drop a photo here</strong> or</p>
        <label class="button primary">
          <span data-i18n="chooseFile">Choose file</span>
          <input id="file-input" type="file" accept="image/*" hidden>
        </label>
      </div>

      <div id="stage" class="stage" hidden>
        <img id="photo" data-i18n-alt="photoAlt" alt="Loaded photo" draggable="false">
        <div id="crop" class="crop" tabindex="0" data-i18n-aria="cropAria" aria-label="Crop area. Drag to move, arrow keys to nudge.">
          <div class="grid"></div>
          <span class="handle" data-handle="nw"></span>
          <span class="handle" data-handle="n"></span>
          <span class="handle" data-handle="ne"></span>
          <span class="handle" data-handle="e"></span>
          <span class="handle" data-handle="se"></span>
          <span class="handle" data-handle="s"></span>
          <span class="handle" data-handle="sw"></span>
          <span class="handle" data-handle="w"></span>
        </div>
      </div>
    </section>

    <aside class="sidebar">
      <section class="panel">
        <h2 data-i18n="format">Format</h2>
        <div id="ratios" class="ratios" role="radiogroup" data-i18n-aria="aspectRatio" aria-label="Aspect ratio">
          <button type="button" data-ratio="16:9" class="active">16:9</button>
          <button type="button" data-ratio="4:3">4:3</button>
          <button type="button" data-ratio="3:2">3:2</button>
          <button type="button" data-ratio="1:1">1:1</button>
          <button type="button" data-ratio="5:4">5:4</button>
          <button type="button" data-ratio="21:9">21:9</button>
          <button type="button" data-ratio="original" data-i18n="original">Original</button>
          <button type="button" data-ratio="free" data-i18n="free">Free</button>
        </div>
        <div class="row">
          <button type="button" id="orientation" class="button">Portrait ⇄</button>
          <button type="button" id="reset" class="button" data-i18n="reset">Reset area</button>
        </div>
        <p class="hint" data-i18n="hint">Drag the area to move it, drag the handles to resize. Arrow keys nudge (Shift = 10 px).</p>
      </section>

      <section class="panel">
        <h2 data-i18n="preview">Preview</h2>
        <div class="preview-box">
          <canvas id="preview" hidden></canvas>
          <p id="preview-empty" class="muted" data-i18n="previewEmpty">Load a photo to see the preview.</p>
        </div>
        <p id="dimensions" class="muted"></p>
      </section>

      <section class="panel">
        <h2 data-i18n="export">Export</h2>
        <label class="field">
          <span data-i18n="fileType">File type</span>
          <select id="format">
            <option value="image/jpeg">JPEG</option>
            <option value="image/png">PNG</option>
            <option value="image/webp">WebP</option>
          </select>
        </label>
        <label class="field" id="quality-field">
          <span><span data-i18n="quality">Quality</span> <output id="quality-value">92</output></span>
          <input id="quality" type="range" min="50" max="100" value="92">
        </label>
        <label class="field">
          <span data-i18n="outWidth">Output width (px, empty = full resolution)</span>
          <input id="out-width" type="number" min="16" step="1" data-i18n-placeholder="full" placeholder="full">
        </label>
        <button type="button" id="download" class="button primary wide" disabled data-i18n="download">Download</button>
        <button type="button" id="change-photo" class="button wide" hidden data-i18n="another">Load another photo</button>
      </section>
    </aside>
  </main>

  <script src="app.js"></script>
</body>
</html>
